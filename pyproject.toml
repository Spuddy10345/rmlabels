[project]
name = "rmlabels"
version = "2.0.0"
description = "Combine shipping labels onto 4-up A4 label sheets, from the CLI or a local web UI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28",
    "pillow>=10.0",
    "pillow-heif>=0.18",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
rmlabels = "rmlabels.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rmlabels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__:DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]
