{% if message %}<div class="flash {{ 'error' if error }}" role="{{ 'alert' if error else 'status' }}"><span class="grow">{{ message }}</span>{% if undo %}<button type="button" class="ghost small" hx-post="/items/restore" hx-vals='{"ids": "{{ undo }}"}' hx-include="#controls" hx-target="#panel">Undo</button>{% endif %}<button type="button" class="ghost small" data-dismiss aria-label="Dismiss">✕</button></div>{% endif %}
